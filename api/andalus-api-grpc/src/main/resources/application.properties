# CDI disambiguation for andalus-api-grpc: exclude conflicting beans.
# 
# ObjectMapper: Quarkus (io.quarkus.jackson.runtime.ObjectMapperProducer) is the canonical producer.
#   Exclude the duplicates from safetensor and local-sdk.
#
# ProviderRegistry: AqliProviderRegistry (aqli-engine) is preferred.
#   Exclude DefaultProviderRegistry from aqli-provider-core.
#
# AqliSdk: LocalAqliSdk (@DefaultBean) is the intended SDK for the API layer.
#   Exclude SafetensorAqliSdk which is a lower-level engine wrapper.
#
# NOTE: SystemModule is NOT excluded — it provides RequestConfigRepository and RunnerMetrics
#       beans needed by ModelRouterService and SelectionPolicy.
quarkus.arc.exclude-types=\
  tech.kayys.aqli.safetensor.config.SafetensorConfigProducer,\
  tech.kayys.aqli.sdk.local.LocalAqliSdkProvider,\
  tech.kayys.aqli.provider.core.DefaultProviderRegistry,\
  tech.kayys.aqli.safetensor.engine.sdk.SafetensorAqliSdk
