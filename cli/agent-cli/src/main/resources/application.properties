# ═══════════════════════════════════════════════════════════
# Gamelan CLI Application Configuration
# ═══════════════════════════════════════════════════════════

# ── Gamelan Engine Configuration ─────────────────────────
gamelan.engine.mode=auto
gamelan.remote.url=
gamelan.api.key=community
gamelan.request.timeout.seconds=120

# ── Tool Configuration ───────────────────────────────────
gamelan.tools.approval-mode=auto
gamelan.tools.sandbox-enabled=false
gamelan.tools.trusted=
gamelan.tools.blocked=

# ── Skills Configuration ─────────────────────────────────
gamelan.skills.dir=

# ── Aqli Hub Configuration ─────────────────────────────
aqli.hub.token=

# ── Logging Configuration ────────────────────────────────
quarkus.log.console.format=%-5p [%c{2.}] %s%e%n
quarkus.log.category."tech.kayys.gamelan".level=INFO
quarkus.log.category."tech.kayys.aqli".level=INFO
quarkus.log.console.json=false

# ── Quarkus Exclusions ───────────────────────────────────
quarkus.arc.exclude-types=tech.kayys.aqli.safetensor.config.SafetensorConfigProducer,tech.kayys.aqli.sdk.local.LocalAqliSdkProvider$WeldDummyProducers

# ── Native Image ─────────────────────────────────────────
quarkus.native.additional-build-args=-J--add-modules=jdk.incubator.vector,--add-modules=jdk.incubator.vector
