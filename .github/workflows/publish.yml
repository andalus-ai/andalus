name: Publish — GitHub Packages

# Triggers:
#   1. Automatically on every push to `main` (publishes a SNAPSHOT)
#   2. Manually via the GitHub UI, where you can specify a release version
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (e.g. 1.0.0). Leave empty to publish SNAPSHOT."
        required: false
        type: string

permissions:
  contents: read
  packages: write  # Required to publish to GitHub Packages

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM (Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven
          # This auto-creates a ~/.m2/settings.xml with the github server configured
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # ── Aqli SPI/SDK Bootstrap ────────────────────────────────────────────
      - name: Checkout aqli (SPI/SDK bootstrap)
        uses: actions/checkout@v4
        with:
          repository: bhangun/aqli
          path: _aqli
          ref: main

      - name: Cache Gradle packages (aqli)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aqli-gradle-${{ hashFiles('_aqli/gradle/wrapper/gradle-wrapper.properties', '_aqli/build.gradle.kts') }}
          restore-keys: |
            aqli-gradle-

      - name: Publish aqli SPI & SDK to Maven Local
        working-directory: _aqli
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          TASKS=(
            :spi:aqli-spi:publishToMavenLocal
            :spi:aqli-spi-audio:publishToMavenLocal
            :spi:aqli-spi-image:publishToMavenLocal
            :spi:aqli-spi-inference:publishToMavenLocal
            :spi:aqli-spi-multimodal:publishToMavenLocal
            :spi:aqli-spi-plugin:publishToMavenLocal
            :spi:aqli-spi-runtime:publishToMavenLocal
            :sdk:aqli-sdk-core:publishToMavenLocal
            :sdk:aqli-sdk:publishToMavenLocal
            :sdk:aqli-sdk-local:publishToMavenLocal
          )
          ./gradlew "${TASKS[@]}" --no-daemon -x test --parallel
      # ────────────────────────────────────────────────────────────────────────

      # ── Optional: Set a release version if triggered manually ──────────────
      - name: Set Release Version
        if: ${{ inputs.release_version != '' }}
        run: |
          echo "Setting release version to ${{ inputs.release_version }}"
          ./mvnw versions:set -DnewVersion=${{ inputs.release_version }} -DgenerateBackupPoms=false -q

      # ── Build all modules (skip tests for speed; CI already tested) ────────
      - name: Build all modules
        run: ./mvnw clean package -DskipTests -Pci -q

      # ── Deploy to GitHub Packages ───────────────────────────────────────────
      - name: Deploy to GitHub Packages
        run: |
          ./mvnw deploy \
            -DskipTests \
            -Pci \
            -q
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Tag a release commit if a specific version was provided ───────────
      - name: Tag Release
        if: ${{ inputs.release_version != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release ${{ inputs.release_version }} [skip ci]" || true
          git tag "v${{ inputs.release_version }}"
          git push origin "v${{ inputs.release_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
