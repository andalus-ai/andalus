name: Publish — GitHub Packages

# Triggers:
#   1. Automatically on every push to `main` (publishes a SNAPSHOT)
#   2. Manually via the GitHub UI, where you can specify a release version
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (e.g. 1.0.0). Leave empty to publish SNAPSHOT."
        required: false
        type: string

permissions:
  contents: read
  packages: write  # Required to publish to GitHub Packages

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM (Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven
          # This auto-creates a ~/.m2/settings.xml with the github server configured
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Checkout Andalus Framework
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/andalus-framework
          path: _andalus-framework
          ref: main

      - name: Publish Framework schema contracts to Maven Local
        working-directory: _andalus-framework
        run: ./mvnw -B -pl framework/andalus-schema-core -am install -DskipTests -q

      # ── AQLI + Aljabr composite-build bootstrap ────────────────────────────
      - name: Checkout AQLI (SPI/SDK bootstrap)
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/aqli
          path: _aqli
          ref: main

      - name: Checkout Aljabr (AQLI source dependency)
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/aljabr
          path: _aqli/aljabr
          ref: main

      - name: Checkout Suling (AQLI audio dependency)
        uses: actions/checkout@v4
        with:
          repository: bhangun/suling
          path: _aqli/suling
          ref: main

      - name: Setup Gradle for AQLI
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Cache Gradle packages (AQLI and Aljabr)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aqli-gradle-${{ hashFiles('_aqli/gradle/wrapper/gradle-wrapper.properties', '_aqli/build.gradle.kts') }}
          restore-keys: |
            aqli-gradle-

      - name: Publish aqli SPI & SDK to Maven Local
        working-directory: _aqli
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          TASKS=(
            :spi:aqli-spi:publishToMavenLocal
            :spi:aqli-spi-audio:publishToMavenLocal
            :spi:aqli-spi-image:publishToMavenLocal
            :spi:aqli-spi-inference:publishToMavenLocal
            :spi:aqli-spi-multimodal:publishToMavenLocal
            :spi:aqli-spi-plugin:publishToMavenLocal
            :spi:aqli-spi-runtime:publishToMavenLocal
            :sdk:aqli-sdk-api:publishToMavenLocal
            :sdk:aqli-sdk-protobuf:publishToMavenLocal
            :sdk:aqli-sdk-core:publishToMavenLocal
            :sdk:aqli-sdk:publishToMavenLocal
            :sdk:aqli-sdk-local:publishToMavenLocal
            :core:aqli-core:publishToMavenLocal
            :tokenizer:aqli-tokenizer-core:publishToMavenLocal
            :repository:aqli-model-repo-common:publishToMavenLocal
            :repository:aqli-model-repo-local:publishToMavenLocal
            :repository:aqli-model-database:publishToMavenLocal
            :plugin:aqli-plugin-kernel-core:publishToMavenLocal
          )
          ./gradlew "${TASKS[@]}" --no-daemon -x test --parallel
      # ────────────────────────────────────────────────────────────────────────

      - name: Checkout Gamelan
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/gamelan
          path: gamelan
          ref: main

      - name: Setup Gradle for Gamelan
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Publish Gamelan SPI and executor SDK to Maven Local
        working-directory: gamelan
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          gradle \
            :gamelan-engine-spi:publishToMavenLocal \
            :gamelan-sdk-client-core:publishToMavenLocal \
            :gamelan-plugin-spi:publishToMavenLocal \
            :gamelan-sdk-executor-core:publishToMavenLocal \
            --no-daemon -x test --parallel \
            -Pgamelan.publish.enabled=true \
            -Pgamelan.version=1.0.0-SNAPSHOT

      - name: Publish Framework provider dependencies to Maven Local
        working-directory: _andalus-framework
        run: >-
          ./mvnw -B -ntp
          -f framework/pom.xml
          -pl andalus-embedding,andalus-provider
          -am install
          -Dmaven.test.skip=true

      - name: Install Runtime Core Framework dependency closure
        working-directory: _andalus-framework
        run: >-
          ./mvnw -B -ntp
          -f framework/pom.xml
          -pl andalus-core,andalus-knowledge,andalus-agent,andalus-tool,andalus-execution-api,andalus-runtime-spi,andalus-observability,andalus-resilience,andalus-engine,andalus-anp,andalus-harness,andalus-a2a,andalus-memory
          -am install
          -Dmaven.test.skip=true

      # ── Optional: Set a release version if triggered manually ──────────────
      - name: Set Release Version
        if: ${{ inputs.release_version != '' }}
        run: |
          echo "Setting release version to ${{ inputs.release_version }}"
          ./mvnw versions:set -DnewVersion=${{ inputs.release_version }} -DgenerateBackupPoms=false -q

      # ── Build all modules (skip tests for speed; CI already tested) ────────
      - name: Build all modules
        run: ./mvnw clean package -DskipTests -Pci -q

      # ── Deploy to GitHub Packages ───────────────────────────────────────────
      - name: Deploy to GitHub Packages
        run: |
          ./mvnw deploy \
            -DskipTests \
            -Pci \
            -q
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Tag a release commit if a specific version was provided ───────────
      - name: Tag Release
        if: ${{ inputs.release_version != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release ${{ inputs.release_version }} [skip ci]" || true
          git tag "v${{ inputs.release_version }}"
          git push origin "v${{ inputs.release_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
