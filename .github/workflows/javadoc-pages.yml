name: Publish Andalus Javadoc

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Generate Javadoc
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      # Framework provider modules consume AQLI/Aljabr and Gamelan artifacts
      # that are not published to Maven Central. Reproduce the same source bootstrap
      # used by the main CI workflow before installing the Framework reactor.
      - name: Checkout Aljabr (AQLI composite dependency)
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/aljabr
          path: aljabr
          ref: main

      - name: Checkout AQLI
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/aqli
          path: _aqli
          ref: main

      - name: Checkout Suling (AQLI audio dependency)
        uses: actions/checkout@v4
        with:
          repository: bhangun/suling
          path: _aqli/suling
          ref: main

      - name: Install Suling audio API to Maven Local
        run: mvn --batch-mode --no-transfer-progress -f _aqli/suling/pom.xml -DskipTests install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Publish AQLI SPI and SDK dependencies to Maven Local
        working-directory: _aqli
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          TASKS=(
            :spi:aqli-spi:publishToMavenLocal
            :spi:aqli-spi-audio:publishToMavenLocal
            :spi:aqli-spi-image:publishToMavenLocal
            :spi:aqli-spi-inference:publishToMavenLocal
            :spi:aqli-spi-multimodal:publishToMavenLocal
            :spi:aqli-spi-plugin:publishToMavenLocal
            :spi:aqli-spi-runtime:publishToMavenLocal
            :sdk:aqli-sdk-api:publishToMavenLocal
            :sdk:aqli-sdk-protobuf:publishToMavenLocal
            :sdk:aqli-sdk-core:publishToMavenLocal
            :sdk:aqli-sdk:publishToMavenLocal
            :sdk:aqli-sdk-local:publishToMavenLocal
            :core:aqli-core:publishToMavenLocal
            :tokenizer:aqli-tokenizer-core:publishToMavenLocal
            :repository:aqli-model-repo-common:publishToMavenLocal
            :repository:aqli-model-repo-local:publishToMavenLocal
            :repository:aqli-model-database:publishToMavenLocal
            :plugin:aqli-plugin-kernel-core:publishToMavenLocal
          )
          gradle "${TASKS[@]}" --no-daemon -x test --parallel

      - name: Checkout Gamelan
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/gamelan
          path: gamelan
          ref: main

      - name: Publish Gamelan SPI and executor SDK dependencies to Maven Local
        working-directory: gamelan
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          gradle \
            :gamelan-engine-spi:publishToMavenLocal \
            :gamelan-sdk-client-core:publishToMavenLocal \
            :gamelan-plugin-spi:publishToMavenLocal \
            :gamelan-sdk-executor-core:publishToMavenLocal \
            --no-daemon -x test --parallel \
            -Pgamelan.publish.enabled=true \
            -Pgamelan.version=1.0.0-SNAPSHOT

      # The framework is a separate Maven reactor. Install the artifacts used by
      # this repository before asking the root reactor to resolve Javadoc classpaths.
      - name: Checkout Andalus Framework
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/andalus-framework
          path: _andalus-framework
          ref: main

      - name: Install Framework dependency closure
        working-directory: _andalus-framework
        run: >-
          ./mvnw -B -ntp
          -f framework/pom.xml
          -pl andalus-core,andalus-knowledge,andalus-agent,andalus-tool,andalus-execution-api,andalus-runtime-spi,andalus-observability,andalus-resilience,andalus-engine,andalus-anp,andalus-harness,andalus-a2a,andalus-memory,andalus-embedding,andalus-provider
          -am install
          -Dmaven.test.skip=true

      - name: Generate aggregate Javadoc
        run: |
          ./mvnw -B -ntp \
            javadoc:aggregate-no-fork \
            -DskipTests \
            -Dmaven.test.skip=true \
            -DexcludePackageNames=tech.kayys.andalus.agent.backend.gamelan \
            -Dmaven.javadoc.failOnError=false \
            -Dmaven.javadoc.failOnWarnings=false

      - name: Assemble module documentation site
        run: |
          set -euo pipefail
          rm -rf target/pages
          mkdir -p target/pages/modules
          {
            printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Andalus API Documentation</title></head><body><h1>Andalus API Documentation</h1><p>Generated from the Maven reactor.</p><ul>'
            while IFS= read -r report; do
              module_dir="${report%/target/reports/apidocs/index.html}"
              module_name="$(basename "$module_dir")"
              destination="target/pages/modules/${module_dir#./}"
              mkdir -p "$destination"
              cp -R "$module_dir/target/reports/apidocs/." "$destination/"
              printf '<li><a href="/andalus/modules/%s/index.html">%s</a></li>\n' "${module_dir#./}" "$module_name"
            done < <(find . -path '*/target/reports/apidocs/index.html' -not -path './target/*' | sort)
            printf '%s\n' '</ul></body></html>'
          } > target/pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    name: Deploy Javadoc Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
