name: CI — Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout andalus
        uses: actions/checkout@v4

      - name: Setup GraalVM (Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      # Alkhawarizm is the former name of Aljabr. AQLI still discovers the
      # composite build using the historical repository/path identity.
      - name: Checkout Aljabr foundation (legacy Alkhawarizm repository)
        uses: actions/checkout@v4
        with:
          repository: bhangun/alkhawarizm
          path: alkhawarizm
          ref: main

      # Aljabr's composite build detects Tafkir for quantizer SNAPSHOTs.
      - name: Checkout Tafkir quantizer dependency
        uses: actions/checkout@v4
        with:
          repository: bhangun/tafkir
          path: tafkir
          ref: main

      # Tafkir's diffusion API has an unresolved dependency on
      # :trainer:alkhawarizm-trainer-api. Its diffusion OPD module also
      # depends on the excluded diffusion API. Neither is needed for the
      # quantizer artifacts used by this bootstrap, so exclude these aliases
      # in this ephemeral CI checkout only; do not modify upstream sources.
      # Legacy aliases also require their implicit parent directories.
      - name: Isolate Tafkir quantizer projects for bootstrap
        working-directory: tafkir
        run: |
          sed -i '/includeLegacyAlias("training:api:tafkir-train-diffusion-api",/d' settings.gradle.kts
          sed -i '/includeLegacyAlias("ml:tafkir-ml-diffusion-api",/d' settings.gradle.kts
          sed -i '/includeLegacyAlias("training:loop:tafkir-train-diffusion-opd",/d' settings.gradle.kts
          sed -i '/includeLegacyAlias("ml:tafkir-ml-diffusion-opd",/d' settings.gradle.kts
          mkdir -p quantizer trainer

      # ── AQLI SPI/SDK Bootstrap ────────────────────────────────────────────
      - name: Checkout aqli (SPI/SDK bootstrap)
        uses: actions/checkout@v4
        with:
          repository: bhangun/aqli
          path: _aqli
          ref: main

      # AQLI maps the optional :tokenizer parent project to framework/tokenizer,
      # while the actual tokenizer module lives under framework/core.
      - name: Prepare AQLI tokenizer parent directory
        working-directory: _aqli
        run: mkdir -p framework/tokenizer

      - name: Cache Gradle packages (aqli)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aqli-gradle-${{ hashFiles('_aqli/gradle/wrapper/gradle-wrapper.properties', '_aqli/build.gradle.kts') }}
          restore-keys: |
            aqli-gradle-

      - name: Publish aqli SPI & SDK to Maven Local
        working-directory: _aqli
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          TASKS=(
            :spi:aqli-spi:publishToMavenLocal
            :spi:aqli-spi-audio:publishToMavenLocal
            :spi:aqli-spi-image:publishToMavenLocal
            :spi:aqli-spi-inference:publishToMavenLocal
            :spi:aqli-spi-multimodal:publishToMavenLocal
            :spi:aqli-spi-plugin:publishToMavenLocal
            :spi:aqli-spi-runtime:publishToMavenLocal
            :sdk:aqli-sdk-core:publishToMavenLocal
            :sdk:aqli-sdk:publishToMavenLocal
            :sdk:aqli-sdk-local:publishToMavenLocal
          )
          ./gradlew "${TASKS[@]}" --no-daemon --configure-on-demand -x test --parallel

      - name: Build and Test (all modules)
        run: ./mvnw clean verify -DskipTests=false -Pci -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7
