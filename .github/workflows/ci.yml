name: CI — Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout andalus
        uses: actions/checkout@v4

      - name: Setup GraalVM (Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      # AQLI detects ../alkhawarizm as a composite build. Alkhawarizm in turn
      # detects ../tafkir for its quantizer SNAPSHOTs. Check out both source
      # repositories as siblings so these dependencies resolve from source.
      - name: Checkout alkhawarizm dependency
        uses: actions/checkout@v4
        with:
          repository: bhangun/alkhawarizm
          path: alkhawarizm
          ref: main

      - name: Checkout tafkir dependency
        uses: actions/checkout@v4
        with:
          repository: bhangun/tafkir
          path: tafkir
          ref: main

      # Tafkir exposes legacy :quantizer:* aliases. Gradle creates the
      # implicit :quantizer parent project at quantizer/, even though each
      # leaf alias points to inference/quantization. Keep the parent directory
      # present until Tafkir removes or remaps those legacy aliases.
      - name: Prepare Tafkir legacy quantizer parent directory
        working-directory: tafkir
        run: mkdir -p quantizer

      # ── Aqli SPI/SDK Bootstrap ────────────────────────────────────────────
      # aqli-spi* and aqli-sdk* are SNAPSHOT artifacts not on Maven Central.
      # Build the pure-Java framework modules; no native backend build needed.
      - name: Checkout aqli (SPI/SDK bootstrap)
        uses: actions/checkout@v4
        with:
          repository: bhangun/aqli
          path: _aqli
          ref: main

      # AQLI maps the optional :tokenizer parent project to framework/tokenizer,
      # while the actual tokenizer module lives under framework/core. Keep the
      # project included because aqli-sdk-local declares it as a dependency;
      # create the missing parent directory rather than dropping the module.
      # Remove this shim once AQLI corrects its directory mapping upstream.
      - name: Prepare AQLI tokenizer parent directory
        working-directory: _aqli
        run: mkdir -p framework/tokenizer

      - name: Cache Gradle packages (aqli)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: aqli-gradle-${{ hashFiles('_aqli/gradle/wrapper/gradle-wrapper.properties', '_aqli/build.gradle.kts') }}
          restore-keys: |
            aqli-gradle-

      - name: Publish aqli SPI & SDK to Maven Local
        working-directory: _aqli
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          # Publish only the modules that exist and that andalus depends on.
          # aqli-spi-model is optional and may not be present in all checkouts.
          TASKS=(
            :spi:aqli-spi:publishToMavenLocal
            :spi:aqli-spi-audio:publishToMavenLocal
            :spi:aqli-spi-image:publishToMavenLocal
            :spi:aqli-spi-inference:publishToMavenLocal
            :spi:aqli-spi-multimodal:publishToMavenLocal
            :spi:aqli-spi-plugin:publishToMavenLocal
            :spi:aqli-spi-runtime:publishToMavenLocal
            :sdk:aqli-sdk-core:publishToMavenLocal
            :sdk:aqli-sdk:publishToMavenLocal
            :sdk:aqli-sdk-local:publishToMavenLocal
          )
          ./gradlew "${TASKS[@]}" --no-daemon -x test --parallel
      # ────────────────────────────────────────────────────────────────────────

      - name: Build and Test (all modules)
        run: ./mvnw clean verify -DskipTests=false -Pci -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7
