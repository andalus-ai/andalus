name: CI — Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout andalus
        uses: actions/checkout@v4

      - name: Setup GraalVM (Java 25)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      - name: Checkout Andalus Framework schema contracts
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/andalus-framework
          path: _andalus-framework
          ref: main

      - name: Publish framework schema contracts to Maven Local
        working-directory: _andalus-framework
        run: ./mvnw -B -pl framework/andalus-schema-core -am install -DskipTests -q

      # AQLI consumes the canonical Aljabr source as a Gradle composite build.
      # Keep the sibling checkout path exactly as expected by _aqli/settings.gradle.kts.
      - name: Checkout Aljabr (AQLI source dependency)
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/aljabr
          path: aljabr
          ref: main

      - name: Checkout AQLI (SPI/SDK bootstrap)
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/aqli
          path: _aqli
          ref: main

      - name: Setup Gradle 9.4.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"

      - name: Cache Gradle packages (AQLI and Aljabr)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: inference-gradle-${{ hashFiles('_aqli/gradle/wrapper/gradle-wrapper.properties', '_aqli/build.gradle.kts', 'aljabr/gradle/wrapper/gradle-wrapper.properties', 'aljabr/build.gradle.kts') }}
          restore-keys: |
            inference-gradle-

      - name: Publish AQLI SPI & SDK to Maven Local
        working-directory: _aqli
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          TASKS=(
            :spi:aqli-spi:publishToMavenLocal
            :spi:aqli-spi-audio:publishToMavenLocal
            :spi:aqli-spi-image:publishToMavenLocal
            :spi:aqli-spi-inference:publishToMavenLocal
            :spi:aqli-spi-multimodal:publishToMavenLocal
            :spi:aqli-spi-plugin:publishToMavenLocal
            :spi:aqli-spi-runtime:publishToMavenLocal
            :sdk:aqli-sdk-api:publishToMavenLocal
            :sdk:aqli-sdk-protobuf:publishToMavenLocal
            :sdk:aqli-sdk-core:publishToMavenLocal
            :sdk:aqli-sdk:publishToMavenLocal
            :sdk:aqli-sdk-local:publishToMavenLocal
            :core:aqli-core:publishToMavenLocal
            :plugin:aqli-plugin-kernel-core:publishToMavenLocal
          )
          gradle "${TASKS[@]}" --no-daemon -x test --parallel

      - name: Checkout gamelan (OpenAI provider embedding dependency)
        uses: actions/checkout@v4
        with:
          repository: andalus-ai/gamelan
          path: gamelan
          ref: main

      - name: Publish Gamelan SPI and executor SDK to Maven Local
        working-directory: gamelan
        env:
          GRADLE_OPTS: "-Xmx2G -Dorg.gradle.daemon=false"
        run: |
          gradle \
            :gamelan-engine-spi:publishToMavenLocal \
            :gamelan-plugin-spi:publishToMavenLocal \
            :gamelan-sdk-executor-core:publishToMavenLocal \
            --no-daemon -x test --parallel \
            -Pgamelan.publish.enabled=true \
            -Pgamelan.version=1.0.0-SNAPSHOT

      - name: Publish Andalus Framework provider dependencies to Maven Local
        working-directory: _andalus-framework
        run: >-
          ./mvnw -B -ntp
          -f framework/pom.xml
          -pl andalus-embedding,andalus-provider
          -am install
          -Dmaven.test.skip=true

      - name: Build and Test (all modules)
        run: ./mvnw clean verify -DskipTests=false -Pci -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7
