name: Release Andalus

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-native:
    name: Native ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset_name: andalus-standalone-linux-x86_64
            service_bundle_name: andalus-service-bundle-linux-x86_64
            service_os: linux
            shell: bash
          - runner: macos-13
            asset_name: andalus-standalone-osx-x86_64
            service_bundle_name: andalus-service-bundle-osx-x86_64
            service_os: macos
            shell: bash
          - runner: macos-14
            asset_name: andalus-standalone-osx-aarch_64
            service_bundle_name: andalus-service-bundle-osx-aarch_64
            service_os: macos
            shell: bash
          - runner: windows-latest
            asset_name: andalus-standalone-windows-x86_64.exe
            service_bundle_name: andalus-service-bundle-windows-x86_64
            service_os: windows
            shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      - name: Install native-image
        shell: bash
        run: |
          gu install native-image || true

      - name: Build native image (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f pom.xml -pl aqli-runtime-standalone -am clean package -Dnative -DskipTests
          mkdir -p artifacts
          cp aqli-runtime-standalone/target/*-runner "artifacts/${{ matrix.asset_name }}"
          chmod +x "artifacts/${{ matrix.asset_name }}"

      - name: Build Unix service bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="artifacts/${{ matrix.service_bundle_name }}"
          andalus_home="${bundle_root}/.andalus"
          mkdir -p "${andalus_home}/bin" "${andalus_home}/config" "${andalus_home}/logs/server" "${andalus_home}/plugins" "${andalus_home}/secrets" "${andalus_home}/models" "${andalus_home}/mcp" "${andalus_home}/run" "${andalus_home}/vector" "${andalus_home}/aqli/models" "${andalus_home}/aqli/storage"
          printf '%s\n' \
            'ANDALUS_HOME=$HOME/.andalus' \
            'ANDALUS_CONFIG_DIR=$ANDALUS_HOME/config' \
            'ANDALUS_LOG_DIR=$ANDALUS_HOME/logs' \
            'ANDALUS_SERVER_LOG_DIR=$ANDALUS_LOG_DIR/server' \
            'ANDALUS_LOG_FILE_PATH=$ANDALUS_SERVER_LOG_DIR/server.log' \
            'ANDALUS_PLUGINS_DIR=$ANDALUS_HOME/plugins' \
            'ANDALUS_SECRETS_DIR=$ANDALUS_HOME/secrets' \
            'ANDALUS_MODELS_DIR=$ANDALUS_HOME/models' \
            'ANDALUS_MCP_DIR=$ANDALUS_HOME/mcp' \
            'ANDALUS_RUN_DIR=$ANDALUS_HOME/run' \
            'ANDALUS_VECTOR_DIR=$ANDALUS_HOME/vector' \
            'ANDALUS_AQLI_HOME=$ANDALUS_HOME/aqli' \
            'AQLI_HOME=$ANDALUS_AQLI_HOME' \
            '# Legacy override (if needed): AQLI_HOME=$HOME/.aqli' \
            'ANDALUS_AQLI_MODELS_DIR=$ANDALUS_AQLI_HOME/models' \
            'ANDALUS_AQLI_STORAGE_DIR=$ANDALUS_AQLI_HOME/storage' \
            > "${andalus_home}/config/andalus.env.example"
          cp "artifacts/${{ matrix.asset_name }}" "${andalus_home}/bin/${{ matrix.asset_name }}"
          cp "artifacts/${{ matrix.asset_name }}" "${andalus_home}/bin/andalus"
          chmod +x "${andalus_home}/bin/${{ matrix.asset_name }}" "${andalus_home}/bin/andalus"
          mkdir -p "${bundle_root}/scripts/service/${{ matrix.service_os }}"
          cp -R "scripts/service/${{ matrix.service_os }}/." "${bundle_root}/scripts/service/${{ matrix.service_os }}/"
          cp scripts/INSTALL.md "${bundle_root}/INSTALL.md"
          (
            cd "${bundle_root}"
            zip -r "../${{ matrix.service_bundle_name }}.zip" .
          )

      - name: Build native image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mvn -B -ntp -f pom.xml -pl aqli-runtime-standalone -am clean package -Dnative -DskipTests
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $runner = Get-ChildItem -Path aqli-runtime-standalone\target -Filter "*-runner.exe" | Select-Object -First 1
          if (-not $runner) { throw "Native executable not found." }
          Copy-Item $runner.FullName "artifacts/${{ matrix.asset_name }}"

      - name: Build Windows service bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleRoot = "artifacts/${{ matrix.service_bundle_name }}"
          $andalusHome = Join-Path $bundleRoot ".andalus"
          New-Item -ItemType Directory -Force -Path "$andalusHome\bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$andalusHome\config" | Out-Null
          New-Item -ItemType Directory -Force -Path "$andalusHome\logs\server" | Out-Null
          New-Item -ItemType Directory -Force -Path "$andalusHome\plugins" | Out-Null
          New-Item -ItemType Directory -Force -Path "$andalusHome\secrets" | Out-Null
          New-Item -ItemType Directory -Force -Path "$andalusHome\models" | Out-Null
          New-Item -ItemType Directory -Force -Path "$andalusHome\mcp" | Out-Null
          New-Item -ItemType Directory -Force -Path "$andalusHome\run" | Out-Null
          New-Item -ItemType Directory -Force -Path "$andalusHome\vector" | Out-Null
          New-Item -ItemType Directory -Force -Path "$andalusHome\aqli\models" | Out-Null
          New-Item -ItemType Directory -Force -Path "$andalusHome\aqli\storage" | Out-Null
          @(
            "ANDALUS_HOME=%USERPROFILE%\.andalus",
            "ANDALUS_CONFIG_DIR=%ANDALUS_HOME%\config",
            "ANDALUS_LOG_DIR=%ANDALUS_HOME%\logs",
            "ANDALUS_SERVER_LOG_DIR=%ANDALUS_LOG_DIR%\server",
            "ANDALUS_LOG_FILE_PATH=%ANDALUS_SERVER_LOG_DIR%\server.log",
            "ANDALUS_PLUGINS_DIR=%ANDALUS_HOME%\plugins",
            "ANDALUS_SECRETS_DIR=%ANDALUS_HOME%\secrets",
            "ANDALUS_MODELS_DIR=%ANDALUS_HOME%\models",
            "ANDALUS_MCP_DIR=%ANDALUS_HOME%\mcp",
            "ANDALUS_RUN_DIR=%ANDALUS_HOME%\run",
            "ANDALUS_VECTOR_DIR=%ANDALUS_HOME%\vector",
            "ANDALUS_AQLI_HOME=%ANDALUS_HOME%\aqli",
            "AQLI_HOME=%ANDALUS_AQLI_HOME%",
            "; Legacy override (if needed): AQLI_HOME=%USERPROFILE%\.aqli",
            "ANDALUS_AQLI_MODELS_DIR=%ANDALUS_AQLI_HOME%\models",
            "ANDALUS_AQLI_STORAGE_DIR=%ANDALUS_AQLI_HOME%\storage"
          ) | Set-Content "$andalusHome\config\andalus.env.example"
          Copy-Item "artifacts/${{ matrix.asset_name }}" "$andalusHome\bin\${{ matrix.asset_name }}"
          Copy-Item "artifacts/${{ matrix.asset_name }}" "$andalusHome\bin\andalus.exe"
          New-Item -ItemType Directory -Force -Path "$bundleRoot\scripts\service\windows" | Out-Null
          Copy-Item -Path "scripts\service\windows\*" -Destination "$bundleRoot\scripts\service\windows" -Recurse -Force
          Copy-Item "scripts\INSTALL.md" "$bundleRoot\INSTALL.md"
          Push-Location $bundleRoot
          try {
            $bundleEntries = @(".andalus", "scripts", "INSTALL.md")
            Compress-Archive -LiteralPath $bundleEntries -DestinationPath "..\${{ matrix.service_bundle_name }}.zip" -Force
          } finally {
            Pop-Location
          }

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Upload service bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service_bundle_name }}
          path: artifacts/${{ matrix.service_bundle_name }}.zip
          if-no-files-found: error

  build-jar-and-service-assets:
    name: Build jar and service assets
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build runnable jar
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f pom.xml -pl aqli-runtime-standalone -am clean package -DskipTests
          release_version="${RELEASE_TAG#v}"
          mkdir -p artifacts
          cp aqli-runtime-standalone/target/*-runner.jar "artifacts/andalus-runtime-standalone-${release_version}.jar"

      - name: Package service assets
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          mkdir -p artifacts/service-assets/scripts/service
          mkdir -p artifacts/service-assets/.andalus/config artifacts/service-assets/.andalus/logs/server artifacts/service-assets/.andalus/plugins artifacts/service-assets/.andalus/secrets artifacts/service-assets/.andalus/models artifacts/service-assets/.andalus/mcp artifacts/service-assets/.andalus/run artifacts/service-assets/.andalus/vector artifacts/service-assets/.andalus/aqli/models artifacts/service-assets/.andalus/aqli/storage
          printf '%s\n' \
            'ANDALUS_HOME=$HOME/.andalus' \
            'ANDALUS_CONFIG_DIR=$ANDALUS_HOME/config' \
            'ANDALUS_LOG_DIR=$ANDALUS_HOME/logs' \
            'ANDALUS_SERVER_LOG_DIR=$ANDALUS_LOG_DIR/server' \
            'ANDALUS_LOG_FILE_PATH=$ANDALUS_SERVER_LOG_DIR/server.log' \
            'ANDALUS_PLUGINS_DIR=$ANDALUS_HOME/plugins' \
            'ANDALUS_SECRETS_DIR=$ANDALUS_HOME/secrets' \
            'ANDALUS_MODELS_DIR=$ANDALUS_HOME/models' \
            'ANDALUS_MCP_DIR=$ANDALUS_HOME/mcp' \
            'ANDALUS_RUN_DIR=$ANDALUS_HOME/run' \
            'ANDALUS_VECTOR_DIR=$ANDALUS_HOME/vector' \
            'ANDALUS_AQLI_HOME=$ANDALUS_HOME/aqli' \
            'AQLI_HOME=$ANDALUS_AQLI_HOME' \
            '# Legacy override (if needed): AQLI_HOME=$HOME/.aqli' \
            'ANDALUS_AQLI_MODELS_DIR=$ANDALUS_AQLI_HOME/models' \
            'ANDALUS_AQLI_STORAGE_DIR=$ANDALUS_AQLI_HOME/storage' \
            > artifacts/service-assets/.andalus/config/andalus.env.example
          cp -R scripts/service/linux artifacts/service-assets/scripts/service/
          cp -R scripts/service/macos artifacts/service-assets/scripts/service/
          cp -R scripts/service/windows artifacts/service-assets/scripts/service/
          cp scripts/INSTALL.md artifacts/service-assets/INSTALL.md
          (
            cd artifacts/service-assets
            zip -r "../andalus-service-assets-${release_version}.zip" .
          )

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: andalus-runtime-standalone-jar
          path: artifacts/andalus-runtime-standalone-*.jar
          if-no-files-found: error

      - name: Upload service assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: andalus-service-assets
          path: artifacts/andalus-service-assets-*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-native
      - build-jar-and-service-assets
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify assets
        shell: bash
        run: |
          set -euo pipefail
          ls -lah release-assets
          expected_assets=(
            "andalus-standalone-linux-x86_64"
            "andalus-standalone-osx-x86_64"
            "andalus-standalone-osx-aarch_64"
            "andalus-standalone-windows-x86_64.exe"
            "andalus-service-bundle-linux-x86_64.zip"
            "andalus-service-bundle-osx-x86_64.zip"
            "andalus-service-bundle-osx-aarch_64.zip"
            "andalus-service-bundle-windows-x86_64.zip"
          )
          for asset in "${expected_assets[@]}"; do
            test -e "release-assets/${asset}"
          done
          ls -1 release-assets/andalus-runtime-standalone-*.jar >/dev/null
          ls -1 release-assets/andalus-service-assets-*.zip >/dev/null

      - name: Verify service bundle layouts
        shell: bash
        run: |
          set -euo pipefail
          normalize_zip_listing() {
            sed -e 's#^\./##' -e 's#\\#/#g'
          }

          extract_zip_entry() {
            local zip_file="$1"
            local entry="$2"
            local output_file="$3"
            if unzip -p "${zip_file}" "${entry}" > "${output_file}" 2>/dev/null; then
              return 0
            fi
            if unzip -p "${zip_file}" "./${entry}" > "${output_file}" 2>/dev/null; then
              return 0
            fi
            if unzip -p "${zip_file}" "${entry//\//\\}" > "${output_file}" 2>/dev/null; then
              return 0
            fi
            return 1
          }

          bundles=(
            "andalus-service-bundle-linux-x86_64.zip"
            "andalus-service-bundle-osx-x86_64.zip"
            "andalus-service-bundle-osx-aarch_64.zip"
            "andalus-service-bundle-windows-x86_64.zip"
          )
          for bundle in "${bundles[@]}"; do
            listing="$(unzip -Z1 "release-assets/${bundle}" | normalize_zip_listing)"
            printf '%s\n' "${listing}" | grep -q '^\.andalus/bin/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/config/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/logs/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/logs/server/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/plugins/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/secrets/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/models/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/mcp/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/run/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/vector/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/aqli/models/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/aqli/storage/'
            printf '%s\n' "${listing}" | grep -q '^\.andalus/config/andalus.env.example$'
            printf '%s\n' "${listing}" | grep -q '^scripts/service/'
            printf '%s\n' "${listing}" | grep -q '^INSTALL.md$'
            case "${bundle}" in
              andalus-service-bundle-linux-x86_64.zip)
                printf '%s\n' "${listing}" | grep -q '^\.andalus/bin/andalus-standalone-linux-x86_64$'
                printf '%s\n' "${listing}" | grep -q '^\.andalus/bin/andalus$'
                printf '%s\n' "${listing}" | grep -q '^scripts/service/linux/install-systemd-user\.sh$'
                ;;
              andalus-service-bundle-osx-x86_64.zip)
                printf '%s\n' "${listing}" | grep -q '^\.andalus/bin/andalus-standalone-osx-x86_64$'
                printf '%s\n' "${listing}" | grep -q '^\.andalus/bin/andalus$'
                printf '%s\n' "${listing}" | grep -q '^scripts/service/macos/install-launchd-agent\.sh$'
                ;;
              andalus-service-bundle-osx-aarch_64.zip)
                printf '%s\n' "${listing}" | grep -q '^\.andalus/bin/andalus-standalone-osx-aarch_64$'
                printf '%s\n' "${listing}" | grep -q '^\.andalus/bin/andalus$'
                printf '%s\n' "${listing}" | grep -q '^scripts/service/macos/install-launchd-agent\.sh$'
                ;;
              andalus-service-bundle-windows-x86_64.zip)
                printf '%s\n' "${listing}" | grep -q '^\.andalus/bin/andalus-standalone-windows-x86_64\.exe$'
                printf '%s\n' "${listing}" | grep -q '^\.andalus/bin/andalus\.exe$'
                printf '%s\n' "${listing}" | grep -q '^scripts/service/windows/install-service\.ps1$'
                ;;
            esac
          done

          env_checks_file="$(mktemp)"
          extract_zip_entry "release-assets/andalus-service-bundle-linux-x86_64.zip" ".andalus/config/andalus.env.example" "${env_checks_file}"
          grep -q '^ANDALUS_HOME=\$HOME/\.andalus$' "${env_checks_file}"
          grep -q '^ANDALUS_CONFIG_DIR=\$ANDALUS_HOME/config$' "${env_checks_file}"
          grep -q '^ANDALUS_LOG_DIR=\$ANDALUS_HOME/logs$' "${env_checks_file}"
          grep -q '^ANDALUS_SERVER_LOG_DIR=\$ANDALUS_LOG_DIR/server$' "${env_checks_file}"
          grep -q '^ANDALUS_LOG_FILE_PATH=\$ANDALUS_SERVER_LOG_DIR/server\.log$' "${env_checks_file}"
          grep -q '^ANDALUS_PLUGINS_DIR=\$ANDALUS_HOME/plugins$' "${env_checks_file}"
          grep -q '^ANDALUS_SECRETS_DIR=\$ANDALUS_HOME/secrets$' "${env_checks_file}"
          grep -q '^ANDALUS_MODELS_DIR=\$ANDALUS_HOME/models$' "${env_checks_file}"
          grep -q '^ANDALUS_MCP_DIR=\$ANDALUS_HOME/mcp$' "${env_checks_file}"
          grep -q '^ANDALUS_RUN_DIR=\$ANDALUS_HOME/run$' "${env_checks_file}"
          grep -q '^ANDALUS_VECTOR_DIR=\$ANDALUS_HOME/vector$' "${env_checks_file}"
          grep -q '^ANDALUS_AQLI_HOME=\$ANDALUS_HOME/aqli$' "${env_checks_file}"
          grep -q '^AQLI_HOME=\$ANDALUS_AQLI_HOME$' "${env_checks_file}"
          grep -q '^ANDALUS_AQLI_MODELS_DIR=\$ANDALUS_AQLI_HOME/models$' "${env_checks_file}"
          grep -q '^ANDALUS_AQLI_STORAGE_DIR=\$ANDALUS_AQLI_HOME/storage$' "${env_checks_file}"
          grep -q '^# Legacy override \(if needed\): AQLI_HOME=\$HOME/\.aqli$' "${env_checks_file}"

          windows_env_checks_file="$(mktemp)"
          extract_zip_entry "release-assets/andalus-service-bundle-windows-x86_64.zip" ".andalus/config/andalus.env.example" "${windows_env_checks_file}"
          grep -q '^ANDALUS_HOME=%USERPROFILE%\\\.andalus$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_CONFIG_DIR=%ANDALUS_HOME%\\config$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_LOG_DIR=%ANDALUS_HOME%\\logs$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_SERVER_LOG_DIR=%ANDALUS_LOG_DIR%\\server$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_LOG_FILE_PATH=%ANDALUS_SERVER_LOG_DIR%\\server\.log$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_PLUGINS_DIR=%ANDALUS_HOME%\\plugins$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_SECRETS_DIR=%ANDALUS_HOME%\\secrets$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_MODELS_DIR=%ANDALUS_HOME%\\models$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_MCP_DIR=%ANDALUS_HOME%\\mcp$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_RUN_DIR=%ANDALUS_HOME%\\run$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_VECTOR_DIR=%ANDALUS_HOME%\\vector$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_AQLI_HOME=%ANDALUS_HOME%\\aqli$' "${windows_env_checks_file}"
          grep -q '^AQLI_HOME=%ANDALUS_AQLI_HOME%$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_AQLI_MODELS_DIR=%ANDALUS_AQLI_HOME%\\models$' "${windows_env_checks_file}"
          grep -q '^ANDALUS_AQLI_STORAGE_DIR=%ANDALUS_AQLI_HOME%\\storage$' "${windows_env_checks_file}"
          grep -q '^; Legacy override \(if needed\): AQLI_HOME=%USERPROFILE%\\\.aqli$' "${windows_env_checks_file}"

          linux_installer_checks_file="$(mktemp)"
          extract_zip_entry "release-assets/andalus-service-bundle-linux-x86_64.zip" "scripts/service/linux/install-systemd-user.sh" "${linux_installer_checks_file}"
          grep -q '^SCRIPT_DIR=' "${linux_installer_checks_file}"
          grep -q '^BUNDLED_ANDALUS_HOME="\${BUNDLE_ROOT}/\.andalus"$' "${linux_installer_checks_file}"
          grep -q '^if \[ -d "\$BUNDLED_ANDALUS_HOME" \] && \[ "\$BUNDLED_ANDALUS_HOME" != "\$ANDALUS_HOME" \]; then$' "${linux_installer_checks_file}"
          grep -q 'tar -C "\$BUNDLED_ANDALUS_HOME" -cf - \. | tar -C "\$ANDALUS_HOME" -xf -' "${linux_installer_checks_file}"
          grep -q '^ANDALUS_HOME="\${ANDALUS_HOME:-\$HOME/\.andalus}"$' "${linux_installer_checks_file}"
          grep -q '^ANDALUS_MODELS_DIR="\${ANDALUS_MODELS_DIR:-\$ANDALUS_HOME/models}"$' "${linux_installer_checks_file}"
          grep -q '^ANDALUS_MCP_DIR="\${ANDALUS_MCP_DIR:-\$ANDALUS_HOME/mcp}"$' "${linux_installer_checks_file}"
          grep -q '^ANDALUS_RUN_DIR="\${ANDALUS_RUN_DIR:-\$ANDALUS_HOME/run}"$' "${linux_installer_checks_file}"
          grep -q '^ANDALUS_VECTOR_DIR="\${ANDALUS_VECTOR_DIR:-\$ANDALUS_HOME/vector}"$' "${linux_installer_checks_file}"
          grep -q '^ANDALUS_AQLI_HOME="\${ANDALUS_AQLI_HOME:-\$ANDALUS_HOME/aqli}"$' "${linux_installer_checks_file}"
          grep -q '^LEGACY_AQLI_HOME="\${AQLI_HOME:-\$HOME/\.aqli}"$' "${linux_installer_checks_file}"

          macos_installer_checks_file="$(mktemp)"
          extract_zip_entry "release-assets/andalus-service-bundle-osx-x86_64.zip" "scripts/service/macos/install-launchd-agent.sh" "${macos_installer_checks_file}"
          grep -q '^SCRIPT_DIR=' "${macos_installer_checks_file}"
          grep -q '^BUNDLED_ANDALUS_HOME="\${BUNDLE_ROOT}/\.andalus"$' "${macos_installer_checks_file}"
          grep -q '^if \[ -d "\$BUNDLED_ANDALUS_HOME" \] && \[ "\$BUNDLED_ANDALUS_HOME" != "\$ANDALUS_HOME" \]; then$' "${macos_installer_checks_file}"
          grep -q 'tar -C "\$BUNDLED_ANDALUS_HOME" -cf - \. | tar -C "\$ANDALUS_HOME" -xf -' "${macos_installer_checks_file}"
          grep -q '^ANDALUS_HOME="\${ANDALUS_HOME:-\$HOME/\.andalus}"$' "${macos_installer_checks_file}"
          grep -q '^ANDALUS_MODELS_DIR="\${ANDALUS_MODELS_DIR:-\$ANDALUS_HOME/models}"$' "${macos_installer_checks_file}"
          grep -q '^ANDALUS_MCP_DIR="\${ANDALUS_MCP_DIR:-\$ANDALUS_HOME/mcp}"$' "${macos_installer_checks_file}"
          grep -q '^ANDALUS_RUN_DIR="\${ANDALUS_RUN_DIR:-\$ANDALUS_HOME/run}"$' "${macos_installer_checks_file}"
          grep -q '^ANDALUS_VECTOR_DIR="\${ANDALUS_VECTOR_DIR:-\$ANDALUS_HOME/vector}"$' "${macos_installer_checks_file}"
          grep -q '^ANDALUS_AQLI_HOME="\${ANDALUS_AQLI_HOME:-\$ANDALUS_HOME/aqli}"$' "${macos_installer_checks_file}"
          grep -q '^LEGACY_AQLI_HOME="\${AQLI_HOME:-\$HOME/\.aqli}"$' "${macos_installer_checks_file}"

          windows_installer_checks_file="$(mktemp)"
          extract_zip_entry "release-assets/andalus-service-bundle-windows-x86_64.zip" "scripts/service/windows/install-service.ps1" "${windows_installer_checks_file}"
          grep -q '^\$ScriptDir = Split-Path -Parent \$MyInvocation\.MyCommand\.Path$' "${windows_installer_checks_file}"
          grep -q '^\$BundleRoot = \(Resolve-Path \(Join-Path \$ScriptDir "\.\.\\\.\.\\\.\."\)\)\.Path$' "${windows_installer_checks_file}"
          grep -q '^\$BundledAndalusHome = Join-Path \$BundleRoot "\.andalus"$' "${windows_installer_checks_file}"
          grep -q '^\s*Copy-Item -Path \(Join-Path \$BundledAndalusHome "\*"\) -Destination \$AndalusHome -Recurse -Force$' "${windows_installer_checks_file}"
          grep -q '^\s*\$AndalusHome = if \(\$env:ANDALUS_HOME\) \{ \$env:ANDALUS_HOME \} else \{ "\$env:USERPROFILE\\\.andalus" \}$' "${windows_installer_checks_file}"
          grep -q '^\$AndalusModelsDir = if \(\$env:ANDALUS_MODELS_DIR\) \{ \$env:ANDALUS_MODELS_DIR \} else \{ Join-Path \$AndalusHome "models" \}$' "${windows_installer_checks_file}"
          grep -q '^\$AndalusMcpDir = if \(\$env:ANDALUS_MCP_DIR\) \{ \$env:ANDALUS_MCP_DIR \} else \{ Join-Path \$AndalusHome "mcp" \}$' "${windows_installer_checks_file}"
          grep -q '^\$AndalusRunDir = if \(\$env:ANDALUS_RUN_DIR\) \{ \$env:ANDALUS_RUN_DIR \} else \{ Join-Path \$AndalusHome "run" \}$' "${windows_installer_checks_file}"
          grep -q '^\$AndalusVectorDir = if \(\$env:ANDALUS_VECTOR_DIR\) \{ \$env:ANDALUS_VECTOR_DIR \} else \{ Join-Path \$AndalusHome "vector" \}$' "${windows_installer_checks_file}"
          grep -q '^\s*"ANDALUS_MODELS_DIR=\$AndalusModelsDir",' "${windows_installer_checks_file}"
          grep -q '^\s*"ANDALUS_MCP_DIR=\$AndalusMcpDir",' "${windows_installer_checks_file}"
          grep -q '^\s*"ANDALUS_RUN_DIR=\$AndalusRunDir",' "${windows_installer_checks_file}"
          grep -q '^\s*"ANDALUS_VECTOR_DIR=\$AndalusVectorDir",' "${windows_installer_checks_file}"
          grep -q '^\$AqliHome = if \(\$env:ANDALUS_AQLI_HOME\) \{ \$env:ANDALUS_AQLI_HOME \} else \{ Join-Path \$AndalusHome "aqli" \}$' "${windows_installer_checks_file}"
          grep -q '^\$legacyAqliHome = if \(\$env:AQLI_HOME\) \{ \$env:AQLI_HOME \} else \{ "\$env:USERPROFILE\\\.aqli" \}$' "${windows_installer_checks_file}"

      - name: Verify service assets archive layout
        shell: bash
        run: |
          set -euo pipefail
          normalize_zip_listing() {
            sed -e 's#^\./##' -e 's#\\#/#g'
          }

          extract_zip_entry() {
            local zip_file="$1"
            local entry="$2"
            local output_file="$3"
            if unzip -p "${zip_file}" "${entry}" > "${output_file}" 2>/dev/null; then
              return 0
            fi
            if unzip -p "${zip_file}" "./${entry}" > "${output_file}" 2>/dev/null; then
              return 0
            fi
            if unzip -p "${zip_file}" "${entry//\//\\}" > "${output_file}" 2>/dev/null; then
              return 0
            fi
            return 1
          }

          service_assets_zip="$(ls -1 release-assets/andalus-service-assets-*.zip | head -n1)"
          test -n "${service_assets_zip}"
          listing="$(unzip -Z1 "${service_assets_zip}" | normalize_zip_listing)"
          printf '%s\n' "${listing}" | grep -q '^\.andalus/config/andalus.env.example$'
          printf '%s\n' "${listing}" | grep -q '^\.andalus/logs/'
          printf '%s\n' "${listing}" | grep -q '^\.andalus/logs/server/'
          printf '%s\n' "${listing}" | grep -q '^\.andalus/plugins/'
          printf '%s\n' "${listing}" | grep -q '^\.andalus/secrets/'
          printf '%s\n' "${listing}" | grep -q '^\.andalus/models/'
          printf '%s\n' "${listing}" | grep -q '^\.andalus/mcp/'
          printf '%s\n' "${listing}" | grep -q '^\.andalus/run/'
          printf '%s\n' "${listing}" | grep -q '^\.andalus/vector/'
          printf '%s\n' "${listing}" | grep -q '^\.andalus/aqli/models/'
          printf '%s\n' "${listing}" | grep -q '^\.andalus/aqli/storage/'
          printf '%s\n' "${listing}" | grep -q '^scripts/service/linux/'
          printf '%s\n' "${listing}" | grep -q '^scripts/service/macos/'
          printf '%s\n' "${listing}" | grep -q '^scripts/service/windows/'
          env_checks_file="$(mktemp)"
          extract_zip_entry "${service_assets_zip}" ".andalus/config/andalus.env.example" "${env_checks_file}"
          grep -q '^ANDALUS_HOME=\$HOME/\.andalus$' "${env_checks_file}"
          grep -q '^ANDALUS_CONFIG_DIR=\$ANDALUS_HOME/config$' "${env_checks_file}"
          grep -q '^ANDALUS_LOG_DIR=\$ANDALUS_HOME/logs$' "${env_checks_file}"
          grep -q '^ANDALUS_SERVER_LOG_DIR=\$ANDALUS_LOG_DIR/server$' "${env_checks_file}"
          grep -q '^ANDALUS_LOG_FILE_PATH=\$ANDALUS_SERVER_LOG_DIR/server\.log$' "${env_checks_file}"
          grep -q '^ANDALUS_PLUGINS_DIR=\$ANDALUS_HOME/plugins$' "${env_checks_file}"
          grep -q '^ANDALUS_SECRETS_DIR=\$ANDALUS_HOME/secrets$' "${env_checks_file}"
          grep -q '^ANDALUS_MODELS_DIR=\$ANDALUS_HOME/models$' "${env_checks_file}"
          grep -q '^ANDALUS_MCP_DIR=\$ANDALUS_HOME/mcp$' "${env_checks_file}"
          grep -q '^ANDALUS_RUN_DIR=\$ANDALUS_HOME/run$' "${env_checks_file}"
          grep -q '^ANDALUS_VECTOR_DIR=\$ANDALUS_HOME/vector$' "${env_checks_file}"
          grep -q '^ANDALUS_AQLI_HOME=\$ANDALUS_HOME/aqli$' "${env_checks_file}"
          grep -q '^AQLI_HOME=\$ANDALUS_AQLI_HOME$' "${env_checks_file}"
          grep -q '^ANDALUS_AQLI_MODELS_DIR=\$ANDALUS_AQLI_HOME/models$' "${env_checks_file}"
          grep -q '^ANDALUS_AQLI_STORAGE_DIR=\$ANDALUS_AQLI_HOME/storage$' "${env_checks_file}"
          grep -q '^# Legacy override \(if needed\): AQLI_HOME=\$HOME/\.aqli$' "${env_checks_file}"

      - name: Verify runtime Aqli path defaults
        shell: bash
        run: |
          set -euo pipefail
          runtime_props="aqli-runtime-standalone/src/main/resources/application.properties"
          grep -q '^andalus.home=\${ANDALUS_HOME:\${user.home}/\.andalus}$' "${runtime_props}"
          grep -q '^andalus.config.dir=\${ANDALUS_CONFIG_DIR:\${andalus.home}/config}$' "${runtime_props}"
          grep -q '^andalus.logs.dir=\${ANDALUS_LOG_DIR:\${andalus.home}/logs}$' "${runtime_props}"
          grep -q '^andalus.logs.server.dir=\${ANDALUS_SERVER_LOG_DIR:\${andalus.logs.dir}/server}$' "${runtime_props}"
          grep -q '^andalus.plugins.dir=\${ANDALUS_PLUGINS_DIR:\${andalus.home}/plugins}$' "${runtime_props}"
          grep -q '^andalus.secrets.dir=\${ANDALUS_SECRETS_DIR:\${andalus.home}/secrets}$' "${runtime_props}"
          grep -q '^andalus.models.dir=\${ANDALUS_MODELS_DIR:\${andalus.home}/models}$' "${runtime_props}"
          grep -q '^andalus.mcp.dir=\${ANDALUS_MCP_DIR:\${andalus.home}/mcp}$' "${runtime_props}"
          grep -q '^andalus.run.dir=\${ANDALUS_RUN_DIR:\${andalus.home}/run}$' "${runtime_props}"
          grep -q '^andalus.vector.dir=\${ANDALUS_VECTOR_DIR:\${andalus.home}/vector}$' "${runtime_props}"
          grep -q '^andalus.vector.faiss.index.path=\${ANDALUS_FAISS_INDEX_PATH:\${andalus.vector.dir}/index.faiss}$' "${runtime_props}"
          grep -q '^andalus.aqli.home=\${ANDALUS_AQLI_HOME:\${andalus.home}/aqli}$' "${runtime_props}"
          grep -q '^andalus.aqli.models.dir=\${ANDALUS_AQLI_MODELS_DIR:\${andalus.aqli.home}/models}$' "${runtime_props}"
          grep -q '^andalus.aqli.storage.dir=\${ANDALUS_AQLI_STORAGE_DIR:\${andalus.aqli.home}/storage}$' "${runtime_props}"
          grep -q '^aqli.home=\${ANDALUS_AQLI_HOME:\${AQLI_HOME:\${andalus.aqli.home}}}$' "${runtime_props}"
          grep -q '^quarkus.log.file.path=\${ANDALUS_LOG_FILE_PATH:\${andalus.logs.server.dir}/server.log}$' "${runtime_props}"

      - name: Create/Update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release-assets/andalus-standalone-linux-x86_64
            release-assets/andalus-standalone-osx-x86_64
            release-assets/andalus-standalone-osx-aarch_64
            release-assets/andalus-standalone-windows-x86_64.exe
            release-assets/andalus-service-bundle-linux-x86_64.zip
            release-assets/andalus-service-bundle-osx-x86_64.zip
            release-assets/andalus-service-bundle-osx-aarch_64.zip
            release-assets/andalus-service-bundle-windows-x86_64.zip
            release-assets/andalus-runtime-standalone-*.jar
            release-assets/andalus-service-assets-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Andalus standalone release assets:
            - Native executables
            - Service-ready executable bundles with `.andalus/*` layout
            - Runnable standalone jar
            - Service helper scripts archive
            
            Service/runtime default paths:
            - `ANDALUS_HOME` => `~/.andalus`
            - `ANDALUS_CONFIG_DIR` => `~/.andalus/config`
            - `ANDALUS_LOG_DIR` => `~/.andalus/logs`
            - `ANDALUS_SERVER_LOG_DIR` => `~/.andalus/logs/server`
            - `ANDALUS_LOG_FILE_PATH` => `~/.andalus/logs/server/server.log`
            - `ANDALUS_PLUGINS_DIR` => `~/.andalus/plugins`
            - `ANDALUS_SECRETS_DIR` => `~/.andalus/secrets`
            - `ANDALUS_MODELS_DIR` => `~/.andalus/models`
            - `ANDALUS_MCP_DIR` => `~/.andalus/mcp`
            - `ANDALUS_RUN_DIR` => `~/.andalus/run`
            - `ANDALUS_VECTOR_DIR` => `~/.andalus/vector`
            - `ANDALUS_AQLI_HOME` => `~/.andalus/aqli`
            - `AQLI_HOME` => `~/.andalus/aqli` (default via `ANDALUS_AQLI_HOME`), fallback `~/.aqli` if needed
